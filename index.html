<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bem-vindo</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #333;
    }

    .card {
      background-color: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    h1 {
      font-size: 2.2em;
      margin-bottom: 20px;
      color: #2f3e46;
    }

    p {
      font-size: 1.1em;
      color: #555;
    }

    a.button {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 24px;
      background-color: #0077b6;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    a.button:hover {
      background-color: #023e8a;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Olá, mundo!</h1>
    <p>Este é um exemplo de página HTML elegante e responsiva.</p>
    <a href="#" class="button">Saiba mais</a>
  </div>
</body>
</html>
